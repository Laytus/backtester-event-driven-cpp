[project]
name = "backtester-event-driven-analysis"
version = "0.1.0"
description = "Data acquisition, validation and analysis tools for the C++ backtester"
requires-python = ">=3.13,<3.15"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.3",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.pyright]
extraPaths = ["python"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "build"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
